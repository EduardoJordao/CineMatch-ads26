<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineMatch</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
  <link rel="icon" type="image/x-icon" href="pngwing.com.png">
</head>
<body>
  <main>
    <h1>CineMatch 🎥</h1>
    <p>Olá, somos da CineMatch e, através deste formulário, gostaríamos de saber suas preferências de filmes e séries!</p>

    <form id="formulario">
      <label for="nome">Qual é o seu nome ou apelido?</label>
      <input id="nome" name="nome" type="text" required>

      <label for="filme-serie">Qual é a sua preferência: filmes ou séries?</label>
      <select id="filme-serie" name="filme-serie" required>
        <option value="">Selecione</option>
        <option value="filmes">Filmes</option>
        <option value="series">Séries</option>
      </select>

      <label for="genero">Gênero favorito</label>
      <select id="genero" name="genero" required>
        <option value="">Selecione</option>
        <option value="acao">Ação 👮‍♂️</option>
        <option value="comedia">Comédia 🤣</option>
        <option value="drama">Drama 😭</option>
        <option value="ficcao">Ficção 👽</option>
        <option value="terror">Terror 👻</option>
      </select>

      <label for="canais-app">Quais são seus canais ou aplicativos favoritos?</label>
      <select id="canais-app" name="canais-app" required>
        <option value="">Selecione</option>
        <option value="netflix">Netflix</option>
        <option value="amazon-prime">Amazon Prime</option>
        <option value="hbo">HBO</option>
        <option value="apple-tv">Apple TV</option>
        <option value="paramount">Paramount</option>
        <option value="globoplay">Globoplay</option>
      </select>

      <label for="filme">Qual é seu filme ou série favorita?</label>
      <input id="filme" name="filme" type="text" required>

      <label for="audio">Qual é sua preferência de áudio?</label>
      <select id="audio" name="audio" required>
        <option value="">Selecione</option>
        <option value="dublado">Dublado</option>
        <option value="legendado">Legendado</option>
        <option value="ingles">Inglês</option>
      </select>

      <button type="submit">Enviar</button>
    </form>

    <p id="resultado"></p>
  </main>

</body>
</html>
